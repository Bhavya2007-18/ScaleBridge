name: ScaleBridge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Scientific Engine & API Tests
        run: |
          cd backend
          pytest --cov=scalebridge_science --cov=app

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install Dependencies
        run: |
          cd frontend
          npm ci
      - name: Typecheck
        run: |
          cd frontend
          npm run typecheck
