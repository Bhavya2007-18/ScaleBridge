[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scalebridge-backend"
version = "0.1.0"
description = "ScaleBridge Bio — Bioprocess scale-up & intelligence backend and scientific engine"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "email-validator>=2.1.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1.18",
  "alembic>=1.13.1",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8.0",
  "argon2-cffi>=23.1.0",
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "scipy>=1.13.0",
  "pint>=0.23",
  "openpyxl>=3.1.2",
  "boto3>=1.34.0",
  "reportlab>=4.2.0",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.4.4",
  "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scalebridge_science*", "app*"]

[tool.pytest.ini_options]
testpaths = ["scalebridge_science/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["ISC004"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scalebridge_science"]
ignore_missing_imports = true
