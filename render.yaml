# Render Blueprint Specification for ScaleBridge Bio (docs/21_DEPLOYMENT.md)
# Domain F Deliverable (Owner: Person 4 - Reporting, DevOps and Quality Lead)

services:
  # 1. ScaleBridge Bio Backend API Web Service
  - type: web
    name: scalebridge-api
    runtime: python
    region: oregon
    plan: starter
    branch: main
    rootDir: ScaleBridge-Bio/backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scalebridge-postgres
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /var/data/storage
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://scalebridge.bio,http://localhost:3000"
      - key: SEED_DEMO_ON_STARTUP
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
    disk:
      name: scalebridge-data
      mountPath: /var/data
      sizeGB: 10

databases:
  # 2. Managed PostgreSQL 16 Database
  - name: scalebridge-postgres
    region: oregon
    plan: starter
    databaseName: scalebridge
    user: scalebridge
    postgresMajorVersion: 16
